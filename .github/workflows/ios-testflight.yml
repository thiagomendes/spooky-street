name: Build for TestFlight

# Manual only (spec §7 steps 3–4): export the Xcode project from Unity on a temporary Linux
# worker, then archive, sign and upload on a temporary macOS worker. Never submits for review
# or public release. Choose a reviewed commit on main for uploads.
on:
  # A push to main whose head commit message contains "[testflight]" builds and uploads that commit
  # (mode testflight). Other pushes to main skip every job immediately at no cost.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag or branch to build. TestFlight uploads require a commit already on main."
        required: true
        default: main
      mode:
        description: "testflight = sign + upload; unsigned-xcode-check = compile on macOS without credentials; export-only = Unity export only"
        type: choice
        required: true
        default: testflight
        options:
          - testflight
          - unsigned-xcode-check
          - export-only

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  # Pinned Unity 6.3 LTS editor with iOS build support (must match ProjectSettings/ProjectVersion.txt).
  UNITY_IMAGE: unityci/editor:ubuntu-6000.3.28f1-ios-3@sha256:7314cedfa87231a0034adf372f51e7b2c384059e4fdec73ea68ab233d99c3269

jobs:
  preflight:
    name: Resolve commit and check prerequisites
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      marketing_version: ${{ steps.resolve.outputs.marketing_version }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        name: Resolve commit and enforce trusted revisions
        env:
          MODE: ${{ inputs.mode || 'testflight' }}
        run: |
          sha=$(git rev-parse HEAD)
          {
            echo "mode=$MODE"
            echo "sha=$sha"
            echo "short_sha=${sha:0:12}"
            echo "marketing_version=$(sed -n 's/^  bundleVersion: //p' ProjectSettings/ProjectSettings.asset)"
          } >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == "testflight" ]]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error title=Untrusted revision::$sha is not on main. Merge it into main first, then build from main."
              exit 1
            fi
          fi
          echo "Building $sha ($MODE) for Unity $(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
      - name: Check Unity secrets
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          MODE: ${{ inputs.mode || 'testflight' }}
        run: |
          missing=()
          [[ -n "$UNITY_EMAIL" ]] || missing+=("secret UNITY_EMAIL")
          [[ -n "$UNITY_PASSWORD" ]] || missing+=("secret UNITY_PASSWORD")
          if [[ "$MODE" == "testflight" && -z "$IOS_BUNDLE_ID" ]]; then missing+=("variable IOS_BUNDLE_ID"); fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Missing prerequisites::${missing[*]} (see docs/ci-setup.md)"
            exit 1
          fi

  apple-preflight:
    name: Check Apple credentials (testflight environment)
    if: needs.preflight.outputs.mode == 'testflight'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: testflight
    steps:
      - env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 \
                      ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Missing Apple credentials::testflight environment lacks: ${missing[*]} (see docs/ci-setup.md)"
            exit 1
          fi
          echo "All Apple credential secrets are present (values not shown)."

  export:
    name: Unity → Xcode project (Linux)
    needs: [preflight, apple-preflight]
    if: >-
      always() && needs.preflight.result == 'success' &&
      (needs.apple-preflight.result == 'success' || needs.apple-preflight.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SHA: ${{ needs.preflight.outputs.sha }}
      ARCHIVE_NAME: spooky-street-ios-xcode-${{ needs.preflight.outputs.short_sha }}-run${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          lfs: true
          persist-credentials: false
      - name: Free runner disk for the editor image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-ios-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/*.json') }}-${{ hashFiles('Assets/**/*.cs') }}
          restore-keys: |
            Library-ios-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/*.json') }}-
      - name: Pull pinned editor image (iOS module)
        run: docker pull "$UNITY_IMAGE"
      - name: Export Xcode project
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.spookystreet.placeholder' }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: >-
          ci/unity/run-unity.sh "$UNITY_IMAGE"
          "export-ios::-quit -buildTarget iOS -executeMethod SpookyStreet.EditorTools.BuildCommand.BuildIos
          -sssOutput /project/build/iOS -sssBundleId $BUNDLE_ID -sssBuildNumber $BUILD_NUMBER
          -sssCommit $SHA -sssRunId $RUN_NUMBER"
      - name: Package Xcode project with provenance
        env:
          GITHUB_SHA_TO_BUILD: ${{ needs.preflight.outputs.sha }}
          EXPORT_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          test -d build/iOS/Unity-iPhone.xcodeproj || { echo "::error::Unity did not produce Unity-iPhone.xcodeproj"; exit 1; }
          mkdir -p ci-out/xcode-artifact
          # tar keeps executable bits and symlinks that a zip-based artifact upload would lose.
          tar -czf "ci-out/xcode-artifact/$ARCHIVE_NAME.tar.gz" -C build iOS
          cp ci-out/build-report-iOS.json ci-out/xcode-artifact/ 2>/dev/null || true
          python3 tools/ci/write_provenance.py "ci-out/xcode-artifact/$ARCHIVE_NAME.tar.gz" ci-out/xcode-artifact/provenance.json
      - name: Upload Xcode project artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcode-${{ needs.preflight.outputs.sha }}-${{ github.run_id }}
          path: ci-out/xcode-artifact
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-export-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/*.log
            ci-out/*.json
          retention-days: 14

  xcode-unsigned:
    name: Xcode compile check (no signing)
    if: needs.preflight.outputs.mode == 'unsigned-xcode-check'
    needs: [preflight, export]
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: ci
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode-${{ needs.preflight.outputs.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact
      - name: Verify provenance and unpack
        run: ci/ios/verify-artifact.sh "$RUNNER_TEMP/artifact" "${{ needs.preflight.outputs.sha }}" "$GITHUB_RUN_ID"
      - name: Select Xcode
        run: ci/ios/select-xcode.sh "${{ vars.XCODE_MAJOR || '26' }}"
      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild -project "$RUNNER_TEMP/artifact/xcode/iOS/Unity-iPhone.xcodeproj" -scheme Unity-iPhone \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200
          echo "### Unsigned Xcode build succeeded for ${{ needs.preflight.outputs.sha }} (not uploaded)" >> "$GITHUB_STEP_SUMMARY"

  testflight:
    name: Archive, sign and upload (macOS)
    if: needs.preflight.outputs.mode == 'testflight'
    needs: [preflight, export]
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 50
    environment: testflight
    outputs:
      build_number: ${{ steps.number.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: |
            ci
            ios
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode-${{ needs.preflight.outputs.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact
      - name: Verify provenance and unpack
        run: ci/ios/verify-artifact.sh "$RUNNER_TEMP/artifact" "${{ needs.preflight.outputs.sha }}" "$GITHUB_RUN_ID"
      - id: number
        name: Unique build number for this attempt
        run: echo "build_number=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Select Xcode
        run: ci/ios/select-xcode.sh "${{ vars.XCODE_MAJOR || '26' }}"
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          working-directory: ios
          bundler-cache: true
      - name: Write signing material to the runner's temp directory
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
      - name: Sign and upload with fastlane
        working-directory: ios
        env:
          SSS_XCODE_DIR: ${{ runner.temp }}/artifact/xcode/iOS
          SSS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          SSS_BUILD_NUMBER: ${{ steps.number.outputs.build_number }}
          SSS_CERT_PATH: ${{ runner.temp }}/dist.p12
          SSS_PROFILE_PATH: ${{ runner.temp }}/appstore.mobileprovision
          SSS_OUTPUT_DIR: ${{ runner.temp }}/out
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          LANG: en_US.UTF-8
        run: bundle exec fastlane ios ci_testflight
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/appstore.mobileprovision"
      - name: Report upload
        run: |
          {
            echo "### Uploaded to App Store Connect"
            echo "- Commit: \`${{ needs.preflight.outputs.sha }}\`"
            echo "- Version: ${{ needs.preflight.outputs.marketing_version }} (build ${{ steps.number.outputs.build_number }})"
            echo "- Workflow run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "- Processing status: see the next job"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build logs (no IPA, no secrets)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out/xcodebuild-logs
            ${{ runner.temp }}/out/upload.json
          retention-days: 14
          if-no-files-found: ignore

  processing-status:
    name: App Store Connect processing status
    needs: [preflight, testflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          sparse-checkout: tools
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyJWT==2.15.1 cryptography==50.0.2
      - name: Poll processing state
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: >-
          python tools/ci/asc_build_status.py --bundle-id "${{ vars.IOS_BUNDLE_ID }}"
          --version "${{ needs.preflight.outputs.marketing_version }}"
          --build-number "${{ needs.testflight.outputs.build_number }}" --timeout 1800
