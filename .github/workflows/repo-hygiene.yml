name: Repo hygiene

# After each push to main, delete feature/* and fix/* branches whose tip is already contained in
# main, so merged work branches never pile up (cloud sessions cannot delete remote refs themselves).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-hygiene
  cancel-in-progress: true

jobs:
  delete-merged-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Delete merged work branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0
          while read -r ref; do
            branch=${ref#origin/}
            if git merge-base --is-ancestor "$ref" origin/main; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" > /dev/null
              echo "Deleted merged branch ${branch}"
              echo "- deleted \`${branch}\`" >> "$GITHUB_STEP_SUMMARY"
              deleted=$((deleted + 1))
            else
              echo "Kept ${branch} (has commits not in main)"
            fi
          done < <(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/feature/' 'refs/remotes/origin/fix/')
          echo "Deleted ${deleted} merged branch(es)."
